<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Japan → ASEAN Exports (2024)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    .subtitle{
      margin: 6px 0 16px;
      color:#666;
      font-size:14px;
      line-height:1.3;
    }
    body { font-family: system-ui, Arial, sans-serif; margin: 0; padding: 24px; background: #fff; }
    .wrap { max-width: 900px; margin: 0 auto; text-align: center; }
    #vis { width: 100%; }
    .vega-embed { margin: 0 auto; }
    h1 { margin: 0 0 6px; }
    .subtitle a { text-decoration: underline; color: #2563eb; }
    .subtitle a:hover { text-decoration: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <div class="wrap">
    <h1>Japan → ASEAN: Matcha Exports (2024)</h1>
    <p class="subtitle">
      This visualisation shows Japan's matcha export values to ASEAN member countries in 2024,
      expressed as <em>US$ per million inhabitants</em> to allow fair comparison across populations.
      Source:
      <a href="https://comtradeplus.un.org/" target="_blank" rel="noopener noreferrer">UN Comtrade</a>
      (trade data) ·
      <a href="https://www.worldometers.info/world-population/south-eastern-asia-population/" target="_blank" rel="noopener noreferrer">Worldometer</a>
      (population data).
    </p>
    <div id="vis"></div>
  </div>

  <script>
    const GEO_URL = "ne_110m.json";
    const CSV_URL = "matcha_asean.csv";
    const POP_URL = "asean_pop_2024.csv";   // iso3,pop_2024

    const spec = {
      $schema: "https://vega.github.io/schema/vega-lite/v5.json",
      width: 800,
      height: 600,
      projection: { type: "mercator", center: [115, 9], scale: 800 },
      layer: [
        /* Ocean background */
        {
          data: { sphere: true },
          mark: { type: "geoshape", fill: "#e6f2ff", stroke: null }
        },

        { 
          data: { graticule: { step: [3, 3] } },
          mark: { type: "geoshape", fill: null, stroke: "#e0e0e0", strokeWidth: 0.6 }
        },

        /* Outline layer — filtered to ASEAN only */
        { 
          data: { url: GEO_URL, format: { type: "json", property: "features" } },
          transform: [
            { filter: "indexof(['BRN','KHM','IDN','LAO','MYS','MMR','PHL','SGP','THA','VNM','TLS'], datum.properties.iso_a3) >= 0" }
          ],
          mark: { type: "geoshape", fill: null, stroke: "#bdbdbd", strokeWidth: 0.8 }
        },

        /* Choropleth (per-capita) — sequential palette (Viridis), 0→200k */
        { 
          data: { url: GEO_URL, format: { type: "json", property: "features" } },
          transform: [
            { filter: "indexof(['BRN','KHM','IDN','LAO','MYS','MMR','PHL','SGP','THA','VNM','TLS'], datum.properties.iso_a3) >= 0" },
            { lookup: "properties.iso_a3", from: { data: { url: CSV_URL }, key: "iso3", fields: ["country", "export_value"] } },
            { lookup: "properties.iso_a3", from: { data: { url: POP_URL }, key: "iso3", fields: ["pop_2024"] } },
            { calculate: "datum.pop_2024 && datum.pop_2024>0 ? (datum.export_value / datum.pop_2024) * 1e6 : null", as: "exports_per_million" }
          ],
          mark: { type: "geoshape", stroke: "white", strokeWidth: 1.2, strokeJoin: "round" },
          encoding: {
            color: {
              field: "exports_per_million",
              type: "quantitative",
              // Sequential, perceptually-uniform palette; boost low–mid with pow curve
              scale: {
                type: "pow", exponent: 0.5, clamp: true,
                domain: [0, 200000],
                scheme: "viridis"   // try "cividis" or "blues" if you prefer
              },
              legend: {
                orient: "bottom",
                direction: "horizontal",
                title: "US$ per 1M people (0–200k)",
                format: "~s",
                gradientLength: 560,
                gradientThickness: 16,
                values: [0, 50_000, 100_000, 150_000, 200_000]
              }
            },
            tooltip: [
              { field: "properties.name", title: "Country" },
              { field: "export_value", title: "Value of matcha export from Japan (US$)", format: ",.0f" },
              { field: "exports_per_million", title: "Value of matcha export per 1M people (US$)", format: ",.0f" }
            ]
          }
        }
      ]
    };

    vegaEmbed("#vis", spec, { actions: false });
  </script>
</body>
</html>
